name: Publish Livecraft

# Rebuilds and republishes the livecraft fork layer on top of the latest
# upstream main, then publishes @fan92rus/pi-coding-agent under the
# 'livecraft' dist-tag. Runs nightly and on every push to the livecraft
# branch, and can be triggered manually.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - livecraft

permissions:
  contents: write

concurrency:
  group: publish-livecraft
  cancel-in-progress: false

jobs:
  publish:
    # Do not re-run on commits made by this workflow itself (bump + upstream sync).
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'livecraft-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: livecraft
          fetch-depth: 0

      - name: Sync with upstream release tag
        # Rebase the fork layer onto the latest upstream release tag (e.g. v0.83.1).
        # We intentionally track release tags, not main: only tagged releases ship
        # sibling packages to npm, so building the fork against newer main would
        # fail with 404 on unpublished dependencies.
        run: |
          git config user.name "livecraft-bot"
          git config user.email "livecraft-bot@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream --tags
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "Latest upstream release tag: $LATEST_TAG"
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No upstream release tags found."
            exit 1
          fi
          if git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "Livecraft already contains $LATEST_TAG."
          else
            if git merge --no-edit "$LATEST_TAG" 2>&1 | grep -q "CONFLICT"; then
              echo "::error::Merge with $LATEST_TAG conflicted. Resolve manually on the livecraft branch."
              exit 1
            fi
            echo "Merged $LATEST_TAG into livecraft."
            git push origin livecraft
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build (all workspaces in dependency order)
        # The root build script walks every workspace the coding-agent depends
        # on at build time (tui -> telemetry -> ai -> agent -> sqlite-node ->
        # protocol -> client -> server -> coding-agent). A hardcoded
        # tui/ai/agent list fails once upstream adds new sibling packages
        # (e.g. pi-telemetry in v0.84.x).
        run: npm run build

      - name: Bump prerelease version
        # Bump via node directly: npm version in a workspace triggers a
        # background npm install that re-resolves unpublished sibling
        # packages (@earendil-works/pi-client, pi-protocol) and 404s.
        # The patch is bumped from the CURRENT package version, and the
        # livecraft pre-release number is incremented until the version
        # is not yet published, so CI never collides with manual runs.
        # The version is written to package.json AND the lockfiles so npm ci
        # on the next run stays in sync (npm ci fails when package.json and
        # package-lock.json disagree).
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/coding-agent/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            const base = j.version.split('-')[0]; // e.g. 0.83.0
            const [major, minor, patch] = base.split('.').map(Number);
            j.version = major + '.' + minor + '.' + (patch + 1) + '-livecraft.0';
            fs.writeFileSync(p, JSON.stringify(j, null, '\t') + '\n');
            console.log('bumped to', j.version);
          "
          # ensure the version is not already published: increment livecraft.N until free
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const p = 'packages/coding-agent/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            for (let n = 0; ; n++) {
              const candidate = j.version.split('-')[0] + '-livecraft.' + n;
              try { execSync('npm view @fan92rus/pi-coding-agent@' + candidate + ' version', { stdio: 'pipe' }); }
              catch { j.version = candidate; fs.writeFileSync(p, JSON.stringify(j, null, '\t') + '\n'); console.log('final', j.version); break; }
            }
            // Keep the lockfiles in sync with the new package version so the
            // next npm ci in this workflow does not fail.
            const lockPath = 'package-lock.json';
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            if (lock.packages && lock.packages['packages/coding-agent']) {
              lock.packages['packages/coding-agent'].version = j.version;
              fs.writeFileSync(lockPath, JSON.stringify(lock, null, '\t') + '\n');
            }
            const swPath = 'packages/coding-agent/npm-shrinkwrap.json';
            const sw = JSON.parse(fs.readFileSync(swPath, 'utf8'));
            if (sw.packages && sw.packages['']) {
              sw.packages[''].version = j.version;
            }
            // Keep the top-level version field in sync with the package version
            // (npm-shrinkwrap.json has both a top-level version and a
            // packages[""] entry; leaving the top-level stale breaks the
            // check:shrinkwrap consistency test).
            sw.version = j.version;
            fs.writeFileSync(swPath, JSON.stringify(sw, null, '\t') + '\n');
          "
          git add packages/coding-agent/package.json package-lock.json packages/coding-agent/npm-shrinkwrap.json
          git -c user.name="livecraft-bot" -c user.email="livecraft-bot@users.noreply.github.com" \
            commit --no-verify -m "chore: bump to $(node -p "require('./packages/coding-agent/package.json').version")" || true

      - name: Publish to npm
        working-directory: packages/coding-agent
        run: npm publish --access public --tag livecraft --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push bump commit
        run: git push origin livecraft || true
